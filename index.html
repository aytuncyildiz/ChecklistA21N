<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>THY A321 NEO EFB Checklist</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#C8102E">
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-bright: #f0f6fc;
      --thy-red: #C8102E;
      --ecam-green: #00FF66;
      --ecam-amber: #FFB000;
      --ecam-cyan: #00E5FF;
      --completed: #238636;
      --highlight: #1f6feb;
    }
    [data-theme="light"] {
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --border: #d0d7de;
      --text: #24292f;
      --text-bright: #0969da;
      --highlight: #0969da;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--thy-red);
      color: #fff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-title h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.5px; }
    .header-title p { font-size: 0.75rem; opacity: 0.9; }
    .header-actions { display: flex; gap: 8px; }
    button.btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    button.btn:active { transform: scale(0.96); }
    button.btn-warning { background: var(--ecam-amber); color: #000; border: none; }
    button.btn-danger { background: #b62324; color: #fff; border: none; }

    .nav-bar {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      overflow-x: auto;
      padding: 6px 12px;
      gap: 6px;
      scrollbar-width: none;
    }
    .nav-bar::-webkit-scrollbar { display: none; }
    .nav-tab {
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.75rem;
      white-space: nowrap;
      cursor: pointer;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
      color: var(--text);
    }
    .nav-tab.active {
      background: var(--highlight);
      color: #fff;
      border-color: var(--highlight);
      font-weight: bold;
    }
    .nav-tab.done {
      border-color: var(--ecam-green);
      color: var(--ecam-green);
    }

    .main-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .banner-alert {
      background: rgba(255, 176, 0, 0.15);
      border: 1px solid var(--ecam-amber);
      color: var(--ecam-amber);
      padding: 10px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .card-header {
      background: rgba(255,255,255,0.03);
      padding: 12px 16px;
      font-weight: 700;
      font-size: 0.95rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-bright);
    }

    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .item-row:last-child { border-bottom: none; }
    .item-row:hover { background: rgba(255,255,255,0.03); }
    .item-row.active-item {
      outline: 2px solid var(--highlight);
      background: rgba(31, 111, 235, 0.1);
    }
    .item-row.checked {
      opacity: 0.55;
    }
    .item-title { font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .item-action {
      color: var(--ecam-cyan);
      font-family: monospace;
      font-size: 0.95rem;
      font-weight: bold;
    }
    .item-row.checked .item-action {
      color: var(--ecam-green);
    }

    .divider-line {
      background: repeating-linear-gradient(45deg, #2b2b10, #2b2b10 10px, #3d3b14 10px, #3d3b14 20px);
      border: 1px solid var(--ecam-amber);
      color: var(--ecam-amber);
      text-align: center;
      padding: 8px;
      font-weight: bold;
      font-size: 0.75rem;
      letter-spacing: 1px;
      margin: 8px 0;
    }

    footer {
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .primary-btn {
      flex: 1;
      background: var(--completed);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    }
    .primary-btn:active { transform: scale(0.98); }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      padding: 20px;
      overflow-y: auto;
    }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-width: 600px;
      margin: 20px auto;
      overflow: hidden;
    }
    .modal-header {
      background: #b62324;
      color: #fff;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }
    .modal-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="header-title">
        <h1>TURKISH AIRLINES</h1>
        <p>A321 NEO STANDARDIZED EFB CHECKLIST</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-warning" onclick="triggerGoAround()">🔄 GO-AROUND</button>
      <button class="btn btn-danger" onclick="openFailures()">⚠️ FAILURES</button>
      <button class="btn" onclick="toggleTheme()">☀️/🌙</button>
    </div>
  </header>

  <nav class="nav-bar" id="phaseNav"></nav>

  <main class="main-container" id="contentArea"></main>

  <footer>
    <button class="btn" onclick="resetCurrentPhase()">Sıfırla</button>
    <button class="primary-btn" id="confirmBtn" onclick="confirmCurrentItem()">ONAYLA / CHECK</button>
  </footer>

  <div class="modal" id="failureModal">
    <div class="modal-content">
      <div class="modal-header">
        <span>⚠️ QRH - KRİTİK ARIZA PROSEDÜRLERİ</span>
        <button class="btn" onclick="closeFailures()">KAPAT</button>
      </div>
      <div class="modal-body" id="failureList"></div>
    </div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 600, duration = 0.1) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    const checklistData = [
      {
        id: "before_start",
        title: "BEFORE START",
        items: [
          { item: "Cockpit Prep", action: "Completed" },
          { item: "Gear Pins & Covers", action: "Removed" },
          { item: "Signs", action: "On / Auto" },
          { item: "ADIRS", action: "NAV" },
          { item: "Fuel Quantity", action: "____ kg / Balanced" },
          { item: "TO Data", action: "Set (ZFW, ZFWCG, V1, VR, V2, Flex/TOGA)" },
          { item: "Baro Ref", action: "____ Set / Crosschecked" },
          { isDivider: true, text: "--- Below The Line (Pushback & Start İzni Alındığında) ---" },
          { item: "Windows / Doors", action: "Closed" },
          { item: "Beacon", action: "On" },
          { item: "Thr Levers", action: "Idle" },
          { item: "Parking Brake", action: "As Required" }
        ]
      },
      {
        id: "after_start",
        title: "AFTER START",
        items: [
          { item: "Anti Ice", action: "As Required" },
          { item: "ECAM Status", action: "Checked" },
          { item: "Pitch Trim", action: "____% Set" },
          { item: "Rudder Trim", action: "0 / Neutral" }
        ]
      },
      {
        id: "taxi",
        title: "TAXI",
        items: [
          { item: "Flight Controls", action: "Checked (Full Travel)" },
          { item: "Flaps Setting", action: "Conf ____" },
          { item: "Spoilers", action: "Armed" },
          { item: "Auto Brake", action: "MAX" },
          { item: "Takeoff Memo", action: "No Blue" },
          { isDivider: true, text: "--- Below The Line (Runway Yaklaşırken) ---" },
          { item: "Cabin Report", action: "Ready" },
          { item: "TCAS", action: "TA/RA" },
          { item: "Eng Mode Sel", action: "As Required" },
          { item: "Packs", action: "As Required" }
        ]
      },
      {
        id: "line_up",
        title: "LINE-UP",
        items: [
          { item: "TCAS", action: "TA/RA" },
          { item: "Packs", action: "Set" },
          { item: "Exterior Lights", action: "Takeoff / On" }
        ]
      },
      {
        id: "after_takeoff",
        title: "AFTER TAKEOFF",
        items: [
          { item: "Landing Gear", action: "Up" },
          { item: "Flaps", action: "Retracted (0 / Clean)" },
          { item: "Spoilers", action: "Disarmed" },
          { item: "APU Bleed / Master", action: "Off" },
          { item: "Eng Mode Selector", action: "Normal" },
          { item: "Anti Ice", action: "As Required" },
          { item: "TCAS", action: "TA/RA" },
          { item: "Baro Reference", action: "Standard Set & Crosschecked" },
          { item: "ECAM Memo", action: "Checked" }
        ]
      },
      {
        id: "before_descent",
        title: "BEFORE DESCENT",
        items: [
          { item: "Landing Performance", action: "Calculated & Inserted" },
          { item: "Navigation / Radio Aids", action: "Checked & Tuned" },
          { item: "Auto Brake", action: "Low / Med / BTV" },
          { item: "Approach Briefing", action: "Completed" },
          { item: "Descent Clearance", action: "Obtained" },
          { item: "Anti Ice", action: "As Required" },
          { item: "ECAM Status", action: "Checked" },
          { item: "Signs (Seat Belts)", action: "On" }
        ]
      },
      {
        id: "approach",
        title: "APPROACH",
        items: [
          { item: "Briefing", action: "Confirmed" },
          { item: "ECAM Status", action: "Checked" },
          { item: "Seat Belts", action: "On" },
          { item: "Baro Ref", action: "____ Set / Crosschecked" },
          { item: "MDA / DH", action: "Set" }
        ]
      },
      {
        id: "landing",
        title: "LANDING",
        items: [
          { item: "Cabin", action: "Ready" },
          { item: "Auto Thrust", action: "Speed / Off" },
          { item: "Auto Brake", action: "Set (Low / Med / BTV)" },
          { item: "Landing Gear", action: "Down (3 Green)" },
          { item: "Flaps", action: "Conf 3 / Conf Full" }
        ]
      },
      {
        id: "after_landing",
        title: "AFTER LANDING",
        items: [
          { item: "Flaps", action: "Retracted (0 / Clean)" },
          { item: "Spoilers", action: "Disarmed" },
          { item: "Radar & PWS", action: "Off" },
          { item: "TCAS", action: "Standby / XPDR" },
          { item: "APU", action: "Start / Run" },
          { item: "Lights", action: "Set (Strobe Off, Ldg Off, Taxi Set)" },
          { item: "Brake Fans", action: "As Required" },
          { item: "ECAM Status / Memo", action: "Checked" }
        ]
      },
      {
        id: "parking",
        title: "PARKING",
        items: [
          { item: "Parking Brake / Chocks", action: "Set / In Place" },
          { item: "Engines (1 & 2)", action: "Off" },
          { item: "Wing Anti Ice", action: "Off" },
          { item: "Fuel Pumps", action: "Off" },
          { item: "Beacon", action: "Off" }
        ]
      },
      {
        id: "securing",
        title: "SECURING AIRCRAFT",
        items: [
          { item: "ADIRS", action: "Off" },
          { item: "Oxygen", action: "Off" },
          { item: "APU / Ext Power", action: "Off" },
          { item: "Batteries", action: "Off" }
        ]
      },
      {
        id: "go_around",
        title: "GO-AROUND",
        isSpecial: true,
        items: [
          { item: "Thrust Levers", action: "TOGA" },
          { item: "Rotation", action: "Performed" },
          { item: "Flaps", action: "Retract One Step" },
          { item: "Gear", action: "Up" },
          { item: "NAV / HDG", action: "Managed / Selected" },
          { item: "Thrust Levers", action: "Climb" },
          { item: "Flaps & Spoilers", action: "Clean / Disarmed" },
          { item: "Autobrake & Memo", action: "Off / Checked" }
        ]
      }
    ];

    const failureData = [
      {
        title: "ENG 1/2 FAIL OR FIRE",
        steps: ["THR LEVERS: IDLE", "ENG MASTER (AFFECTED): OFF", "ENG FIRE PB: PUSH", "AGENT 1: DISCHARGE (IF REQUIRED)"]
      },
      {
        title: "CABIN ALTITUDE / RAPID DEPRESS",
        steps: ["OXYGEN MASKS: ON / 100%", "EMERGENCY DESCENT: INITIATE", "THR LEVERS: IDLE", "SPEED BRAKES: FULL"]
      },
      {
        title: "DUAL HYD LO PR (G+Y / G+B)",
        steps: ["MAX SPEED: 200 KT", "LANDING GEAR: GRAVITY EXTENSION", "FLAPS: CONF 3", "APPROACH SPEED: VREF + 25 KT"]
      }
    ];

    let currentPhaseIndex = 0;
    let checkedState = {};

    function init() {
      checklistData.forEach(p => { checkedState[p.id] = new Array(p.items.length).fill(false); });
      renderNav();
      renderPhase();
    }

    function renderNav() {
      const nav = document.getElementById("phaseNav");
      nav.innerHTML = checklistData.map((p, idx) => {
        if (p.isSpecial && currentPhaseIndex !== idx) return "";
        const isDone = checkedState[p.id].every((val, i) => checklistData[idx].items[i].isDivider || val);
        return `<div class="nav-tab ${idx === currentPhaseIndex ? 'active' : ''} ${isDone ? 'done' : ''}" onclick="selectPhase(${idx})">${p.title}</div>`;
      }).join("");
    }

    function selectPhase(idx) {
      currentPhaseIndex = idx;
      renderNav();
      renderPhase();
    }

    function renderPhase() {
      const phase = checklistData[currentPhaseIndex];
      const container = document.getElementById("contentArea");
      let html = "";

      if (phase.id === "landing") {
        html += `<div class="banner-alert" onclick="triggerGoAround()">
          <span>⚠️ PAS GEÇME GEREKTİ Mİ? (MISSED APPROACH / GO-AROUND)</span>
          <span>BAŞLAT ➔</span>
        </div>`;
      }

      if (phase.id === "go_around") {
        html += `<div class="banner-alert" style="background: rgba(0, 229, 255, 0.15); border-color: var(--ecam-cyan); color: var(--ecam-cyan);" onclick="returnToApproach()">
          <span>🔄 2. YAKLAŞMAYA DÖN (RETURN TO APPROACH CHECKLIST)</span>
          <span>DÖNÜŞ ➔</span>
        </div>`;
      }

      html += `<div class="card"><div class="card-header"><span>${phase.title} CHECKLIST</span></div>`;

      phase.items.forEach((item, idx) => {
        if (item.isDivider) {
          html += `<div class="divider-line">${item.text}</div>`;
        } else {
          const isChecked = checkedState[phase.id][idx];
          html += `<div class="item-row ${isChecked ? 'checked' : ''}" onclick="toggleItem(${idx})">
            <span class="item-title">${isChecked ? '✓' : '○'} ${item.item}</span>
            <span class="item-action">${item.action}</span>
          </div>`;
        }
      });

      html += `</div>`;
      container.innerHTML = html;
    }

    function toggleItem(itemIdx) {
      const phase = checklistData[currentPhaseIndex];
      checkedState[phase.id][itemIdx] = !checkedState[phase.id][itemIdx];
      playBeep(checkedState[phase.id][itemIdx] ? 880 : 440, 0.08);
      renderPhase();
      renderNav();
    }

    function confirmCurrentItem() {
      const phase = checklistData[currentPhaseIndex];
      const nextIdx = phase.items.findIndex((it, i) => !it.isDivider && !checkedState[phase.id][i]);
      if (nextIdx !== -1) {
        checkedState[phase.id][nextIdx] = true;
        playBeep(880, 0.08);
        renderPhase();
        renderNav();
      } else {
        if (currentPhaseIndex < checklistData.length - 2) {
          selectPhase(currentPhaseIndex + 1);
        }
      }
    }

    function resetCurrentPhase() {
      const phase = checklistData[currentPhaseIndex];
      checkedState[phase.id].fill(false);
      renderPhase();
      renderNav();
    }

    function triggerGoAround() {
      playBeep(350, 0.3);
      const gaIdx = checklistData.findIndex(p => p.id === "go_around");
      selectPhase(gaIdx);
    }

    function returnToApproach() {
      const appIdx = checklistData.findIndex(p => p.id === "approach");
      checkedState["approach"].fill(false);
      checkedState["landing"].fill(false);
      selectPhase(appIdx);
    }

    function openFailures() {
      const modal = document.getElementById("failureModal");
      const list = document.getElementById("failureList");
      list.innerHTML = failureData.map(f => `
        <div style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 6px;">
          <h4 style="color: var(--ecam-amber); margin-bottom: 6px;">${f.title}</h4>
          <ul style="padding-left: 20px; font-size: 0.85rem; line-height: 1.4;">
            ${f.steps.map(s => `<li>${s}</li>`).join("")}
          </ul>
        </div>
      `).join("");
      modal.style.display = "block";
    }

    function closeFailures() {
      document.getElementById("failureModal").style.display = "none";
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme");
      document.documentElement.setAttribute("data-theme", current === "light" ? "dark" : "light");
    }

    init();
  </script>
</body>
</html>
